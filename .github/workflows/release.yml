name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create GitHub Release + push CHANGELOG.md
  packages: write   # push image to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Push multi-arch manifest lists (amd64, arm64, armv7) for all release tags.
  # RouterOS resolves the list automatically, same as it does for docker.io images.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Push multi-arch images
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$MAJOR_MINOR" \
            -t "$IMAGE:latest" \
            --push .

  # Export per-architecture tarballs for /container add file=... on RouterOS.
  tarballs:
    name: Export tarball (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
          - os: ubuntu-latest
            arch: armv7
            platform: linux/arm/v7
            qemu: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Build image
        run: docker buildx build --platform ${{ matrix.platform }} -t dns-filter:${{ matrix.arch }} --load .

      - name: Export tarball
        run: |
          docker save "dns-filter:${{ matrix.arch }}" -o "dns-filter-${{ matrix.arch }}.tar"
          sha256sum "dns-filter-${{ matrix.arch }}.tar" > "dns-filter-${{ matrix.arch }}.tar.sha256"
          ls -lh "dns-filter-${{ matrix.arch }}.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: dns-filter-${{ matrix.arch }}.tar*
          if-no-files-found: error

  release:
    needs: [images, tarballs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the changelog

      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist

      - name: Generate release assets
        run: |
          # Plain version marker for the RouterOS auto-update script
          printf '%s' "${GITHUB_REF_NAME}" > version.txt
          ls -lh dist/

      - name: Generate changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}$TAG"
          COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV:-${TAG}}...${TAG}"

          {
            echo "## What's Changed"
            echo
            git log --no-merges --pretty=format:'* %s (%h)' "$RANGE"
            echo
            echo
            echo "**Full changelog**: $COMPARE_URL"
            echo
            echo "### Assets"
            echo
            echo '* `dns-filter-armv7.tar` — image for 32-bit ARM devices (RB4011, hAP ac²/ac³, CRS3xx…)'
            echo '* `dns-filter-arm64.tar` — image for ARM64 devices (hAP ax³, RB5009…)'
            echo '* `dns-filter-amd64.tar` — image for x86_64 (CHR)'
            echo '* `version.txt` — version marker used by the auto-update script'
          } > release_notes.md

          {
            echo "## [${TAG}] - $(date +%F)"
            echo
            git log --no-merges --pretty=format:'* %s (%h)' "$RANGE"
            echo
          } > changelog_section.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            dist/dns-filter-armv7.tar dist/dns-filter-armv7.tar.sha256 \
            dist/dns-filter-arm64.tar dist/dns-filter-arm64.tar.sha256 \
            dist/dns-filter-amd64.tar dist/dns-filter-amd64.tar.sha256 \
            version.txt

      - name: Update CHANGELOG.md
        env:
          BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if [ ! -f CHANGELOG.md ]; then printf '# Changelog\n' > CHANGELOG.md; fi
          TMP="$(mktemp)"
          head -n 1 CHANGELOG.md > "$TMP"   # keep the '# Changelog' header
          echo >> "$TMP"
          cat changelog_section.md >> "$TMP"
          echo >> "$TMP"
          tail -n +2 CHANGELOG.md >> "$TMP"
          mv "$TMP" CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${GITHUB_REF_NAME} [skip ci]" \
            || { echo "CHANGELOG.md is up to date, nothing to commit"; exit 0; }
          git push origin "$BRANCH" \
            || echo "::warning::Could not push CHANGELOG.md (release itself is unaffected)"
